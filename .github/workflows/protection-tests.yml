name: Protection service tests
on:
  push:
    paths: ['protection/**', '.github/workflows/protection-tests.yml']
  pull_request:
    paths: ['protection/**', '.github/workflows/protection-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r protection/server/requirements.lock
      - run: python -m pytest protection/server/test_security.py -q
      # Production provisioning and signing deliberately stay on the trusted private host.
      # No owner passwords, MFA seeds, activation keys or release private keys belong in CI logs/artifacts.
