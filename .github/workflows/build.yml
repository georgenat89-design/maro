name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      # The in-game test runs on Mesa's software renderer, which accepts shaders that NVIDIA, AMD
      # and Intel drivers refuse to compile. Hold every shader to the GLSL spec as well.
      - name: Check shaders against the GLSL spec
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools > /dev/null
          status=0
          for f in $(find src/main/resources -name '*.fsh' -o -name '*.vsh'); do
            case "$f" in *.vsh) stage=vert ;; *) stage=frag ;; esac
            glslangValidator -S "$stage" "$f" || status=1
          done
          exit $status

      # Launch the real 1.21.11 client with the production jar and drive the GUI.
      # Any mixin failure, crash or render exception fails the build.
      - name: In-game test
        env:
          # Keep OpenAL playback testable on a runner without speakers.
          ALSOFT_DRIVERS: "null"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick > /dev/null
          ./gradlew runProductionClientGameTest --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: maro-gg-mc1.21.11-build-${{ github.run_number }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-gametest.jar

      # Only builds that passed the in-game test become releases. They are published before the
      # slower builder tests below, which still run and report but do not hold the download up.
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-gametest' | head -1)
          gh release create "build-${{ github.run_number }}" "$JAR" \
            --target "${{ github.sha }}" \
            --title "maro.gg build ${{ github.run_number }}" \
            --notes "Minecraft 1.21.11 · commit ${{ github.sha }} · passed the in-game test" \
            --latest

      - name: Schematic builder and auction tests
        env:
          ALSOFT_DRIVERS: "null"
        run: ./gradlew runProductionClientGameTest -PbuilderTestOnly=true --no-daemon --stacktrace

      - name: Print screenshot previews
        if: always()
        run: |
          shopt -s globstar nullglob
          for f in **/screenshots/*.png; do
            convert "$f" -resize 960x540 -quality 72 /tmp/preview.jpg
            echo "PREVIEW_BEGIN $(basename "$f")"
            base64 -w 0 /tmp/preview.jpg; echo
            echo "PREVIEW_END"
          done

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-build-${{ github.run_number }}
          path: "**/screenshots/*.png"

      # Temporary: prints the signatures of game classes new hooks are written against. Last, so it
      # is in the tail of the log that the API hands back.
      - name: Inspect game classes
        if: always()
        continue-on-error: true
        run: |
          JAR=$(find ~/.gradle/caches .gradle -path '*yarn*' -name 'minecraft-*.jar' ! -name '*sources*' 2>/dev/null | grep -v intermediary | head -1)
          echo "INSPECT JAR $JAR"
          for c in net.minecraft.client.render.fog.FogRenderer net.minecraft.client.render.fog.FogData \
              net.minecraft.client.render.fog.LavaFogModifier net.minecraft.client.render.fog.StatusEffectFogModifier \
              net.minecraft.client.render.fog.BlindnessEffectFogModifier net.minecraft.client.render.fog.AtmosphericFogModifier \
              net.minecraft.client.network.AbstractClientPlayerEntity net.minecraft.client.network.OtherClientPlayerEntity \
              net.minecraft.client.render.entity.state.PlayerEntityRenderState net.minecraft.client.render.entity.state.EntityRenderState \
              net.minecraft.client.item.ItemModelManager net.minecraft.client.render.chunk.RenderedChunk; do
            echo "INSPECT === $c"; javap -p -cp "$JAR" $c | grep -v "lambda\$" | sed 's/^/INSPECT /'
          done
          echo "INSPECT --- FogRenderer.applyFog"
          javap -p -c -cp "$JAR" net.minecraft.client.render.fog.FogRenderer | grep -E "^  [a-z].*\(|invoke.*applyFog|putfield|getfield.*FogData" | sed 's/^/INSPECT /'
