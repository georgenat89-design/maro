processResources {
    exclude 'assets/maro/characters/cj.anc'
    exclude 'assets/maro/characters/neighbor.anc'
    exclude 'assets/maro/characters/*.glb'
    exclude 'assets/maro/portrait_faces/**'
    exclude 'assets/maro/portrait_heads/**'
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('jar', Jar) {
    exclude 'dev/maro/render/character/designs/**'
    exclude 'assets/maro/characters/cj.anc'
    exclude 'assets/maro/characters/neighbor.anc'
    exclude 'assets/maro/characters/*.glb'
    exclude 'assets/maro/portrait_faces/**'
    exclude 'assets/maro/portrait_heads/**'
    from('LICENSE-Nathan', 'THIRD_PARTY.md', 'THIRD_PARTY_NOTICES.md')
    from('LICENSES') { into 'LICENSES' }
}

tasks.register('testChunkPulse', JavaExec) {
    dependsOn compileGametestJava
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'dev.maro.chunkpulse.PulseCoreChecks'
}
tasks.register('replayChunkPulse', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.maro.chunkpulse.PulseReplay'
    doFirst {
        if (!providers.gradleProperty('pulseReplay').isPresent()) throw new GradleException('Pass -PpulseReplay=events.json')
        args providers.gradleProperty('pulseReplay').get()
        if (providers.gradleProperty('pulseReplayConfig').isPresent()) args providers.gradleProperty('pulseReplayConfig').get()
    }
}

// Opt-in separate edition; default builds contain no authentication code.
if (providers.gradleProperty('protectedEdition').getOrElse('false') == 'true') {
    apply from: 'protection/build.gradle'
}
