plugins {
    id 'fabric-loom' version "${loom_version}"
}

def buildNumber = System.getenv("GITHUB_RUN_NUMBER")
version = project.mod_version + (buildNumber ? "+build.${buildNumber}" : "+local")
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

repositories {
}

// ---- in-game tests -------------------------------------------------------------------------
// src/gametest is a tiny test mod that drives the real client: it opens the menu through the
// keybind, visits every page and takes screenshots. CI runs it against the *production* jar.
sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

configurations {
    productionMods {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // test-only: compile the gametest source set and add the API to the production test run
    modCompileOnly fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
    productionMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    productionMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
}

tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    destinationDirectory = layout.buildDirectory.dir("devlibs")
    archiveClassifier = "gametest-dev"
}

tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn gametestJar
    input = tasks.named("gametestJar", Jar).flatMap { it.archiveFile }
    archiveClassifier = "gametest"
    addNestedDependencies = false
    classpath.from(sourceSets.gametest.compileClasspath)
}

tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn remapJar, remapGametestJar
    mods.from(configurations.productionMods, remapJar.archiveFile, tasks.named("remapGametestJar").flatMap { it.archiveFile })
    jvmArgs.addAll([
            "-Dfabric.client.gametest",
            "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
    ])
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
