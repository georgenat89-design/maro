plugins {
    id 'fabric-loom' version "${loom_version}"
}

def buildNumber = System.getenv("GITHUB_RUN_NUMBER")
version = project.mod_version + (buildNumber ? "+build.${buildNumber}" : "+local")
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

repositories {
}

// ---- in-game tests -------------------------------------------------------------------------
// src/gametest is a tiny test mod that drives the real client: it opens the menu through the
// keybind, visits every page and takes screenshots. CI runs it against the *production* jar.
sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

configurations {
    productionMods {
        transitive = false
    }
}

dependencies {
    implementation 'org.yaml:snakeyaml:2.7'
    include 'org.yaml:snakeyaml:2.7'
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // test-only: compile the gametest source set and add the API to the production test run
    modCompileOnly fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
    productionMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    productionMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
}

tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    destinationDirectory = layout.buildDirectory.dir("devlibs")
    archiveClassifier = "gametest-dev"
}

tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn gametestJar
    input = tasks.named("gametestJar", Jar).flatMap { it.archiveFile }
    archiveClassifier = "gametest"
    addNestedDependencies = false
    classpath.from(sourceSets.gametest.compileClasspath)
}

tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn remapJar, remapGametestJar
    mods.from(configurations.productionMods, remapJar.archiveFile, tasks.named("remapGametestJar").flatMap { it.archiveFile })
    // Optional companion-mod compatibility run; never bundled into the production jar.
    if (providers.gradleProperty("meteorTestJar").isPresent()) {
        mods.from(file(providers.gradleProperty("meteorTestJar").get()))
    }
    jvmArgs.add("-Dmaro.gametest.projectionOnly=" + providers.gradleProperty("projectionTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.petOnly=" + providers.gradleProperty("petTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.baseEspOnly=" + providers.gradleProperty("baseEspTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.staffOnly=" + providers.gradleProperty("staffTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.spotifyOnly=" + providers.gradleProperty("spotifyTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.hudOnly=" + providers.gradleProperty("hudTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderOnly=" + providers.gradleProperty("builderTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderAuctionOnly=" + providers.gradleProperty("builderAuctionTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderNavigationOnly=" + providers.gradleProperty("builderNavigationTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderChestReturnOnly=" + providers.gradleProperty("builderChestReturnTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderStashOnly=" + providers.gradleProperty("builderStashTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderStashHomesOnly=" + providers.gradleProperty("builderStashHomesTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderStashCheckpointOnly=" + providers.gradleProperty("builderStashCheckpointTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderStashCheckpointStage=" + providers.gradleProperty("builderStashCheckpointStage").getOrElse("423"))
    jvmArgs.add("-Dmaro.gametest.builderStashUpperOnly=" + providers.gradleProperty("builderStashUpperTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderStashFinalOnly=" + providers.gradleProperty("builderStashFinalTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderTurnOnly=" + providers.gradleProperty("builderTurnTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderEntryOnly=" + providers.gradleProperty("builderEntryTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderSurfaceOnly=" + providers.gradleProperty("builderSurfaceTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderWaterOnly=" + providers.gradleProperty("builderWaterTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderStagingOnly=" + providers.gradleProperty("builderStagingTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderCleanupOnly=" + providers.gradleProperty("builderCleanupTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderSealedEscapeOnly=" + providers.gradleProperty("builderSealedEscapeTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderHomeOnly=" + providers.gradleProperty("builderHomeTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderCleanupCeilingOnly=" + providers.gradleProperty("builderCleanupCeilingTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderRepairCycleOnly=" + providers.gradleProperty("builderRepairCycleTestOnly").getOrElse("false"))
    jvmArgs.add("-Dmaro.gametest.builderDoorOnly=" + providers.gradleProperty("builderDoorTestOnly").getOrElse("false"))
      jvmArgs.add("-Dmaro.gametest.builderReceiverOnly=" + providers.gradleProperty("builderReceiverTestOnly").getOrElse("false"))
      jvmArgs.add("-Dmaro.gametest.builderHopperOnly=" + providers.gradleProperty("builderHopperTestOnly").getOrElse("false"))
      jvmArgs.add("-Dmaro.gametest.builderEntryOnly=" + providers.gradleProperty("builderEntryTestOnly").getOrElse("false"))
    jvmArgs.addAll([
            "-Dfabric.client.gametest",
            "-Dfabric.client.gametest.disableNetworkSynchronizer=true",
            "-Dmaro.debug=true"
    ])
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('jar', Jar) {
    from('LICENSE-Nathan', 'THIRD_PARTY.md')
    from('LICENSES') { into 'LICENSES' }
}
